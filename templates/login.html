<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>تسجيل الدخول - منصة التدقيق القانوني</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:#0d1117;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-box{background:#161b22;border:1px solid #2d3748;border-radius:18px;padding:48px 40px;width:100%;max-width:420px;box-shadow:0 8px 32px rgba(0,0,0,.45);}
.login-logo{text-align:center;margin-bottom:32px;}
.login-logo .icon{font-size:2.5rem;background:linear-gradient(135deg,#c9a84c,#7a5f28);width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
.login-logo h1{font-size:1.3rem;color:#e2c97e;font-weight:700;}
.login-logo p{font-size:.75rem;color:#8898aa;margin-top:4px;}
.form-group{margin-bottom:18px;}
.form-group label{display:block;font-size:.8rem;font-weight:600;color:#8898aa;margin-bottom:8px;}
.form-group input{width:100%;padding:12px 16px;background:#1e2530;border:1px solid #2d3748;border-radius:10px;color:#e2e8f0;font-family:'Cairo',sans-serif;font-size:.95rem;outline:none;transition:border-color .2s;}
.form-group input:focus{border-color:#2dd4bf;box-shadow:0 0 0 3px rgba(45,212,191,.15);}
.error{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:#f87171;border-radius:8px;padding:10px 14px;font-size:.82rem;margin-bottom:18px;text-align:center;}
.login-btn{width:100%;padding:13px;background:linear-gradient(135deg,#c9a84c,#7a5f28);border:none;border-radius:10px;color:#fff;font-family:'Cairo',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:opacity .2s;}
.login-btn:hover{opacity:.9;}
</style>
</head>
<body>
<div class="login-box">
  <div class="login-logo">
    <div class="icon">⚖️</div>
    <h1>منصة التدقيق القانوني</h1>
    <p>Legal Audit Platform</p>
  </div>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="POST">
    <div class="form-group">
      <label>اسم المستخدم</label>
      <input type="text" name="username" placeholder="أدخل اسم المستخدم" autocomplete="username" required/>
    </div>
    <div class="form-group">
      <label>كلمة المرور</label>
      <input type="password" name="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" required/>
    </div>
    <button type="submit" class="login-btn">تسجيل الدخول</button>
  </form>
</div>
</body>
</html>
